name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the next version and release notes without releasing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm clean-install
      - run: npm audit signatures

      - name: Decode signing key
        if: ${{ !inputs.dry_run }}
        env:
          KEYSTORE_BASE64: ${{ secrets.FRIENDAR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Repository secret FRIENDAR_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRIENDAR_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          FRIENDAR_KEYSTORE_PASSWORD: ${{ secrets.FRIENDAR_KEYSTORE_PASSWORD }}
          FRIENDAR_KEY_PASSWORD: ${{ secrets.FRIENDAR_KEY_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
